# Build the image and push it. Nothing here deploys.
#
# `scripts/deploy.py` runs the deploy, because the service's settings come from
# `.env` and that is a poor fit for this file: `--substitutions` is itself
# comma-separated, so passing a comma-separated `--set-env-vars` list through it
# needs `^@^` delimiter escaping, and the result is unreadable and easy to get
# wrong. It was also where the configuration drifted - this file used to carry its
# own copy of the models, and a console change to KNOWLEDGE_MODEL would have been
# reverted by the next build without a word.
#
# The three VITE_ values stay here, because they are genuinely build inputs: Vite
# replaces `import.meta.env.VITE_*` at build time, so the Supabase project a bundle
# talks to is fixed when the image is built. The anon key is public by design - it
# ships inside every bundle - so passing it on a command line is not a leak. The
# service-role key is not here and must never be.
#
# Run it through the script:
#
#   uv run python scripts/deploy.py --deploy

substitutions:
  # Frankfurt, to sit beside the Supabase project. docs/ENVIRONMENTS.md picked
  # eu-central-1 for latency to Israel and requires both environments to share a
  # region so measurements transfer; putting the application in another continent
  # would put every one of the ~1.6s of round trips a dashboard makes across it.
  _REGION: europe-west3
  _SERVICE: plantcare-ai
  _REPO: plantcare
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""

# No `images:` block. Cloud Build pushes those only *after* every step has
# finished, so the deploy step below would look for a tag that does not exist yet
# - which is exactly how the first attempt failed. The push is its own step
# instead, ordered before the deploy.

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Refuse early rather than ship a bundle that cannot reach Supabase. Without
  # these, `vite build` succeeds, the image deploys, and the first thing any
  # visitor sees is a blank page with a console error.
  - id: check-substitutions
    name: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_SUPABASE_URL}" || { echo "_SUPABASE_URL is required"; exit 1; }
        test -n "${_SUPABASE_ANON_KEY}" || { echo "_SUPABASE_ANON_KEY is required"; exit 1; }
        echo "ok"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=VITE_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}
