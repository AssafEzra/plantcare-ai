name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      # Integration/e2e need a live DEV Supabase project and run on `dev`, not on PRs.
      - name: Tests
        run: uv run pytest -m "not live and not integration and not e2e and not browser"

  integration:
    name: integration · journeys · RLS matrix
    needs: quality
    # Only on a merge into `dev`. These tests write to a real database, so
    # running them from a fork's pull request would hand a stranger the
    # project's credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
      INTERNAL_TICK_INTERVAL_SECONDS: "0"
      # A key is required for the app to boot; no test spends it, because every
      # agent is driven by a scripted provider and `-m "not live"` excludes the
      # one test that is not.
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      IDENTIFICATION_MODEL: claude-sonnet-5
      KNOWLEDGE_MODEL: claude-sonnet-5
      CARE_MODEL: claude-sonnet-5
      HEALTH_MODEL: claude-sonnet-5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      # Skipped rather than failed when the DEV secrets are not configured: a red
      # X on every merge teaches people to ignore red Xs.
      #
      # But a silent skip taught something worse. This job has never once run - no
      # secrets have ever been set - and it reported green every time, so "CI is
      # green" was repeatedly taken to mean the RLS matrix had passed when nothing
      # had checked it. A run that cannot verify something must say what it did not
      # verify, in the words of the thing at risk rather than the words of the
      # configuration that is missing.
      #
      # Warning, not failure, because a permanently red repository is the noise the
      # comment above is right about. This stops short of honest - the overall tick
      # is still green - and the intended end state is that DEV credentials exist
      # and a skip here becomes a real failure. See FINAL §21 on PR 24.
      - name: Check for DEV credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Integration tests did not run::The RLS matrix and the 9 user journeys were NOT executed. A green check on this run does not mean one user cannot read another user's plants."
            {
              echo "### :warning: Integration tests did not run"
              echo
              echo "**Not executed on this commit:**"
              echo "- the RLS matrix - every policy that keeps one user's rows private"
              echo "- the 9 end-to-end user journeys"
              echo
              echo "A green check covers lint, types and the unit suite only."
              echo "These tests exist and pass; they are run by hand against DEV."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Integration, journeys and the RLS matrix
        if: steps.creds.outputs.available == 'true'
        run: uv run pytest -m "integration and not live and not browser" -q

  secret-scan:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate the credentials."
            exit 1
          fi
          echo "ok: .env is not tracked"
