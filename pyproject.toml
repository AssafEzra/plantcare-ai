[project]
name = "plantcare-ai"
version = "0.1.0"
description = "PlantCare AI — AI-powered personal manager for every plant in the home (Hebrew/RTL MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "streamlit>=1.57",
    "supabase>=2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "structlog>=24.4",
    "anthropic>=0.40",
    "resend>=2.5",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.9",
    # Required for zoneinfo on Windows — the scheduler depends on IANA tz data.
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "freezegun>=1.5",
    "respx>=0.21",
    "pglast>=8.4",
    "psycopg[binary]>=3.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "supabase"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Architectural invariant (PROJECT_STRUCTURE §6): configuration is centralised.
"os.environ".msg = "Read configuration through app.config.settings, never os.environ directly."
"os.getenv".msg = "Read configuration through app.config.settings, never os.getenv directly."

[tool.ruff.lint.per-file-ignores]
"app/config/settings.py" = ["TID251"]
"tests/*" = ["TID251"]

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call a real external provider (slow, costly, excluded from CI)",
    "integration: tests requiring a live DEV Supabase project",
    "e2e: end-to-end journey tests",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*"]
